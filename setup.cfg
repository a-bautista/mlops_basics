[flake8]
max-line-length = 110
exclude = .git,notebooks,references,models,data,virtual_environment_mlops/
# Ignorando ciertos errores para mejorar la flexibilidad y
# adecuar el código a las necesidades específicas del proyecto.
ignore = E731,E501,C901

# E731: Para que nos permita usar expresiones lambda
# E501: Se permiten líneas largas por razones de legibilidad en algunos casos
# C901: Algunas funciones complejas son necesarias para el flujo del proyecto